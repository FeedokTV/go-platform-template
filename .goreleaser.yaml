version: 2  

before:
  hooks:
    - go mod tidy  

builds:
  - main: ./cmd
    binary: server
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X go-platform-template/internal/platform/buildinfo.Version={{.Version}}
      - -X go-platform-template/internal/platform/buildinfo.Commit={{.ShortCommit}}
      - -X go-platform-template/internal/platform/buildinfo.Date={{.Date}}

archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^chore:", "^ci:"] 